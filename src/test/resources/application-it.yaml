camunda:
  bpm:
    enabled: false
    client:
      base-url: http://localhost/engine-rest

opentmf:
  bpmn-sync:
    enabled: false
    deployment-name: TestDeployment
    auto-migrate: false
    bpmn-version: v1
    client-ref:

  http-clients:
    reactive:
      client-type: netty
      bearer-auth:
        token-url: http://placeholder
        form-data:
          grant_type: client_credentials
          client_id: client1
          client_secret: client1Secret
    rest:
      client-type: jdk
      bearer-auth:
        token-url: http://placeholder
        form-data:
          grant_type: client_credentials
          client_id: client1
          client_secret: client1Secret
