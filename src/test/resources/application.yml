spring:
  datasource:
    url: jdbc:tc:postgresql:16.4-alpine:///db
    hikari:
      schema: public
      minimum-idle: 0
      maximum-pool-size: 5

server:
  shutdown: graceful

logging:
  config: classpath:logback-test.xml

logbook:
  format:
    style: http

opentmf:
  db-lock:
    lock-acquire-poll-interval: 100
    lock-acquire-timeout: 1000
    lock-hold-timeout: 60000

  bpmn-sync:
    client-ref: openid

  http-clients:
    openid:
      client-type: netty
      request-timeout-millis: 30000
      response-timeout-millis: 50000
      num-retries: 3
      retry-wait-millis: 100
      bearer-auth:
        token-url: http://placeholder
        form-data:
          grant_type: client_credentials
          client_id: test
          client_secret: testSecret
